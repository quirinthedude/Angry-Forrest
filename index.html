<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angry Forrest</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./img/icons/AF-48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./img/icons/AF-48.png"
    />

      rel="icon"

    <script src="./js/models/World.class.js"></script>
    <script src="./js/models/Keyboard.class.js"></script>
    <script src="./js/models/Level.class.js"></script>
    <script src="./js/levels/level1.js"></script>
    <script src="./js/titleGlyphs.js"></script>
    <script src="./js/models/ScrollingText.class.js"></script>
    <script src="./js/models/IntroScene.class.js"></script>
